<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Status & Action</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 500px;">
        <div class="card shadow p-4">
            <h3 class="mb-3 text-center">🔧 Tool Details</h3>
            
            <div id="loading-view" class="text-center py-4">
                <p>Loading tool details from cloud...</p>
            </div>

            <div id="tool-content" style="display: none;">
                <div class="mb-3">
                    <label class="form-label text-muted">Tool ID</label>
                    <h4 id="display-id" class="fw-bold"></h4>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">Tool Name</label>
                    <h4 id="display-name" class="text-primary"></h4>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted">Current Status</label>
                    <div><span id="display-status" class="badge fs-6"></span></div>
                    <p id="display-borrower-info" class="mt-2 text-danger fw-semibold"></p>
                </div>

                <div id="action-container"></div>
            </div>

            <div class="mt-4 text-center">
                <a href="index.html" class="btn btn-secondary w-100">Back to List</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ PALITAN ITO NG PAREHO MONG FIREBASE CONFIG
       const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "your-project.firebaseapp.com",
    projectId: "your-project",
    storageBucket: "your-project.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcde"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        async function loadToolData() {
            let toolId = getQueryParams();
            let loadingView = document.getElementById('loading-view');
            let toolContent = document.getElementById('tool-content');

            if (!toolId) {
                loadingView.innerHTML = `<div class="alert alert-danger">No Tool ID found in QR Code.</div>`;
                return;
            }

            try {
                const docRef = doc(db, "tools", toolId);
                const docSnap = await getDoc(docRef);

                loadingView.style.display = 'none';
                toolContent.style.display = 'block';

                if (!docSnap.exists()) {
                    document.getElementById('tool-content').innerHTML = `<div class="alert alert-danger">Tool not found with ID: ${toolId}</div>`;
                    return;
                }

                let tool = docSnap.data();

                document.getElementById('display-id').innerText = tool.id;
                document.getElementById('display-name').innerText = tool.name;
                
                let statusBadge = document.getElementById('display-status');
                let borrowerInfo = document.getElementById('display-borrower-info');
                let actionContainer = document.getElementById('action-container');

                if (tool.status === 'Available') {
                    statusBadge.className = 'badge bg-success fs-6';
                    statusBadge.innerText = 'Available';
                    borrowerInfo.innerText = '';

                    actionContainer.innerHTML = `
                        <div class="mb-3">
                            <label class="form-label">Borrower Name:</label>
                            <input type="text" id="borrowerNameInput" class="form-control" placeholder="Enter worker name..." required>
                        </div>
                        <button id="borrowBtn" class="btn btn-primary w-100 py-2">Record Borrow</button>
                    `;

                    document.getElementById('borrowBtn').addEventListener('click', async () => {
                        let nameInput = document.getElementById('borrowerNameInput').value.trim();
                        if (!nameInput) {
                            alert('Please enter the borrower name.');
                            return;
                        }
                        await updateDoc(docRef, {
                            status: 'Borrowed',
                            borrower: nameInput
                        });
                        alert('Borrow recorded successfully!');
                        location.reload();
                    });

                } else {
                    statusBadge.className = 'badge bg-danger fs-6';
                    statusBadge.innerText = 'Borrowed';
                    borrowerInfo.innerText = `Borrowed by: ${tool.borrower}`;

                    actionContainer.innerHTML = `
                        <button id="returnBtn" class="btn btn-success w-100 py-2">Return Tool</button>
                    `;

                    document.getElementById('returnBtn').addEventListener('click', async () => {
                        await updateDoc(docRef, {
                            status: 'Available',
                            borrower: ''
                        });
                        alert('Tool returned successfully! Available for borrowing again.');
                        location.reload();
                    });
                }

            } catch (error) {
                console.error("Error getting tool:", error);
                loadingView.innerHTML = `<div class="alert alert-danger">Error loading data from cloud.</div>`;
            }
        }

        window.onload = loadToolData;
    </script>
</body>
</html>
